Glados:
  llm_model: "bartowski/SicariusSicariiStuff_Llama-3.3-8B-Instruct-128K_Abliterated-GGUF:Q4_K_M"
  completion_url: "http://localhost:12330/v1/chat/completions"
  api_key: null  # Add your API key here if needed!
  interruptible: true
  audio_io: "sounddevice"
  input_mode: "audio"  # audio, text, or both
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "tdt"
  llm_headers: null  # Optional extra headers (e.g., OpenRouter HTTP-Referer, X-Title)
  wake_word: null
  voice: "glados"
  announcement: "All neural network modules are now loaded. System Operational."

  autonomy:
    enabled: true
    tick_interval_s: 30
    cooldown_s: 60
    autonomy_parallel_calls: 1
    autonomy_queue_max: 4
    coalesce_ticks: true
    jobs:
      enabled: true
      poll_interval_s: 1
      hacker_news:
        enabled: false
        interval_s: 1800
        top_n: 5
        min_score: 200
      weather:
        enabled: true
        interval_s: 3600
        latitude: 3.1390
        longitude: 101.6869
        timezone: "Asia/Kuala_Lumpur"
        temp_change_c: 4
        wind_alert_kmh: 40

  mcp_servers:
    - name: "slow_clap_demo"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.slow_clap_server"]
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
    # - name: "time_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.time_info_server"]
    # - name: "disk_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.disk_info_server"]
    # - name: "network_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.network_info_server"]
    # - name: "process_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.process_info_server"]
    # - name: "power_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.power_info_server"]
