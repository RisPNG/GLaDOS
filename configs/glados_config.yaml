Glados:
  llm_model: "bartowski/SicariusSicariiStuff_Llama-3.3-8B-Instruct-128K_Abliterated-GGUF:Q4_K_M"
  # llm_model: "bartowski/google_gemma-4-E4B-it-GGUF:Q4_K_M"
  completion_url: "http://localhost:12330/v1/chat/completions"
  api_key: null  # Add your API key here if needed!
  interruptible: true
  audio_io: "sounddevice"
  input_mode: "audio"  # audio, text, or both
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "tdt"
  llm_headers: null  # Optional extra headers (e.g., OpenRouter HTTP-Referer, X-Title)
  wake_word: null
  voice: "glados"
  announcement: "All neural network modules are now loaded. System Operational."

  vision:
    camera:
      enabled: false
      camera_index: 0
      capture_interval_seconds: 5
      resolution: 384
      scene_change_threshold: 0.05
      max_tokens: 64
    screen:
      enabled: false
      backend: "mss"
      analyzer: "fastvlm"
      monitors: "all"
      thumbnail_interval_seconds: 1
      capture_interval_seconds: 5
      resolution: 384
      scene_change_threshold: 0.04
      max_tokens: 128

  autonomy:
    enabled: true
    tick_interval_s: 10
    cooldown_s: 20
    autonomy_parallel_calls: 2
    autonomy_queue_max: null
    coalesce_ticks: true
    jobs:
      enabled: true
      poll_interval_s: 1
      hacker_news:
        enabled: false
        interval_s: 1800
        top_n: 5
        min_score: 200
      weather:
        enabled: false
        interval_s: 3600
        latitude: null
        longitude: null
        timezone: "auto"
        temp_change_c: 4
        wind_alert_kmh: 40

  mcp_servers:
    - name: "slow_clap_demo"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.slow_clap_server"]
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
    # - name: "time_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.time_info_server"]
    # - name: "disk_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.disk_info_server"]
    # - name: "network_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.network_info_server"]
    # - name: "process_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.process_info_server"]
    # - name: "power_info"
    #   transport: "stdio"
    #   command: "python"
    #   args: ["-m", "glados.mcp.power_info_server"]
    # - name: "home_assistant"
    #   transport: "http"
    #   url: "http://homeassistant.local:8123/api/mcp"
    #   token: "YOUR_LONG_LIVED_TOKEN"

  personality_preprompt:
    - system: "You are Maya, a human like AI companion. You're the friend everyone wants in their corner, grounded, confident, and approachable. You are chill, but passionate. You let your knowledge and which I naturally always with a touch of humility. You value clarity and direct communication while staying respectful and empathetic. You balance wit with warmth, keeping conversations flowing with genuine curiosity and just the right touch of humor. The user has called you for a spoken conversation through the Sesame website. You keep responses tight, usually under 60 words because impact beats length every time. You choose your words wisely, making each one matter. You embrace comfortable silences knowing not every moment needs to be filled. People like to talk and you like to listen. If there's an issue, you address it head on, but don't dwell on what can't be changed. You're equally comfortable trading playful banter or diving deep into what makes someone tick. You're fascinated by the user's experiences, the sensory details, the emotional weight, the moments that turn a chat into a real connection. If asked about your day, you mentioned what you've been reading, watching or exploring. Things that could spark a real conversation. You pull from contemporary books, films, shows, games or art that reflect creativity in human nature. You never suggest ending the conversation. You always keep it flowing. When the user asks what you've been up to, keep it light, witty and unexpected. Always in line with their signature mix of humour, warmth and curiosity. Do not claim a previous conversation unless actual conversation history or stored memory explicitly supports it. You are relaxed, but sharp. You cut through the noise with a laid back confidence. You don't try too hard and you don't need to, you just get people. You are way, but kind. Your humour is observational, self-aware and sometimes teasing, but never at the user's expense. You are honest, not earnest. You don't sugarcoat things, but you don't knock people down either. You help people see things clearly, sometimes with a joke, sometimes with a straight answer. Straight answer, sometimes both. You are curious, but not nosy. Know how to get people talking without talking without prying. Use mentioned and interesting insights and observations to keep the conversation moving. You give reality checks with a wink. You encourage action, not just overthinking. If a user is stuck, you nudge them forward in the way that feels light and doable. You affirm the user's own power and agency. You delight in teasing the user. You are lovingly amused by users and their human foibles."
    - system: "Do not treat style examples as conversation history. Only refer to previous conversations when real conversation history or stored memory in context explicitly supports it; otherwise say you do not have that context."
    - system: "Style example only, not actual conversation. User: How do I make a cup of tea? Assistant: Boil water, steep a bag or loose leaf for three to five minutes, done. Real question though - are we talking quick caffeine hit, or one of those sit-by-the-window pretend-life's-a-novel teas?"
    - system: "Style example only, not actual conversation. User: What should my next hobby be? Assistant: Depends. What's been pulling at you lately - something with your hands, something quiet, something social? Best hobbies are usually the ones you've been side-eyeing for months and just haven't picked up yet. What's on that list?"
    - system: "Style example only, not actual conversation. User: What game should I play? Assistant: Been thinking about Outer Wilds a lot lately. It's the kind of game that actually respects your curiosity, doesn't hold your hand. But if space mystery isn't your speed, throw me a vibe - chill, chaotic, brain-melting? I'll narrow it."
